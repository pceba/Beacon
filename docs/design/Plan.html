<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Beacon · Plan</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2448D8}a:hover{color:#1A36A8}
.num{font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 2px rgba(16,19,24,.04),0 6px 16px rgba(16,19,24,.04)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit;border:0;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1000px;box-sizing:border-box;position:relative;background:#F2F4F7;font-family:'Outfit',sans-serif;color:#101318;overflow:hidden">
  <div style="padding:58px 20px 120px;display:flex;flex-direction:column;gap:20px">
    <header style="display:flex;align-items:flex-end;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#6B7380">Octubre 2026</span>
        <h1 style="margin:0;font-size:32px;line-height:36px;font-weight:600;letter-spacing:-.6px">Plan</h1>
      </div>
      <button style="min-height:36px;padding:0 14px;border-radius:999px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #DDE2E9;font-size:14px;font-weight:600;color:#101318">Hoy</button>
    </header>

    <div role="tablist" aria-label="Semana" class="card" style="padding:10px 8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button role="tab" aria-selected="{{d.sel}}" style="min-height:64px;border-radius:14px;background:{{d.bg}};color:{{d.fg}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          <span style="font-size:11px;font-weight:600;opacity:.75">{{d.letter}}</span>
          <span class="num" style="font-size:18px;font-weight:600">{{d.num}}</span>
          <span style="display:flex;gap:2px;height:4px"><sc-for list="{{d.dots}}" as="c" hint-placeholder-count="1"><span style="width:4px;height:4px;border-radius:2px;background:{{c.color}}"></span></sc-for></span>
        </button>
      </sc-for>
    </div>

    <section aria-label="Agenda" style="display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;padding:0 4px;font-size:17px;font-weight:600">Jueves 15</h2>
      <div class="card" style="padding:6px 0">
        <sc-for list="{{agenda}}" as="a" hint-placeholder-count="3">
          <div style="display:grid;grid-template-columns:64px 1fr;gap:4px;padding:10px 14px 10px 0;border-bottom:{{a.border}}">
            <span class="num" style="text-align:right;padding-right:10px;font-size:13px;font-weight:600;color:#6B7380;padding-top:2px">{{a.time}}</span>
            <div style="display:flex;gap:10px;align-items:stretch">
              <span style="width:3px;border-radius:2px;background:{{a.color}}"></span>
              <div style="display:flex;flex-direction:column;gap:2px">
                <span style="font-size:16px;font-weight:600">{{a.title}}</span>
                <span style="font-size:13px;color:#6B7380">{{a.meta}}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="Tareas del día" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 4px">
        <h2 style="margin:0;font-size:17px;font-weight:600">Tareas</h2>
        <span class="num" style="font-size:13px;color:#6B7380">1 de 4 hechas</span>
      </div>
      <div class="card" style="padding:4px 14px">
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
          <div style="min-height:56px;display:flex;align-items:center;gap:12px;border-bottom:{{t.border}}">
            <button aria-label="{{t.aria}}" style="width:22px;height:22px;border-radius:7px;flex-shrink:0;background:{{t.boxBg}};box-shadow:{{t.boxRing}};color:#FFFFFF;display:flex;align-items:center;justify-content:center">
              <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
            </button>
            <div style="flex:1;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:16px;color:{{t.fg}};text-decoration:{{t.deco}}">{{t.title}}</span>
              <sc-if value="{{t.hasMeta}}" hint-placeholder-val="{{false}}"><span style="font-size:13px;color:{{t.metaColor}}">{{t.meta}}</span></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Navegación" style="position:absolute;left:0;right:0;bottom:0;height:88px;padding:8px 12px 22px;box-sizing:border-box;background:rgba(255,255,255,.94);border-top:1px solid #E4E8EE;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#6B7380;font-size:11px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>Hoy</a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#101318;font-size:11px;font-weight:600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Plan</a>
    <a href="Registrar.dc.html" aria-label="Añadir" style="justify-self:center;width:56px;height:56px;border-radius:28px;background:#101318;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(16,19,24,.24);margin-top:-18px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;stroke-width:2.4"><path d="M5 12h14M12 5v14"/></svg></a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#6B7380;font-size:11px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Diario</a>
    <a href="Datos.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#6B7380;font-size:11px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>Datos</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const letters = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    const dotsByDay = [['#2448D8'], [], ['#B4291F'], ['#2448D8', '#B4291F'], ['#2448D8'], [], []];
    const days = letters.map((letter, i) => {
      const sel = i === 3;
      return {
        letter, num: 12 + i, sel: sel ? 'true' : 'false',
        bg: sel ? '#101318' : 'transparent', fg: sel ? '#FFFFFF' : '#101318',
        dots: dotsByDay[i].map((color) => ({ color: sel ? '#FFFFFF' : color })),
      };
    });
    const agendaDefs = [
      { time: '10:00', title: 'Clase', meta: 'Aula 3.2 · 1 h 30 min', color: '#2448D8' },
      { time: '18:30', title: 'Entreno de pierna', meta: 'Gimnasio', color: '#D2551A' },
      { time: '21:00', title: 'Cena con amigos', meta: 'Centro', color: '#8B4FD1' },
    ];
    const agenda = agendaDefs.map((a, i) => ({ ...a, border: i === agendaDefs.length - 1 ? '0' : '1px solid #EEF1F4' }));
    const taskDefs = [
      { title: 'Entregar TFG', meta: 'Vence hoy · Alta', metaColor: '#B4291F', done: false },
      { title: 'Comprar creatina', meta: '', done: false },
      { title: 'Llamar al dentista', meta: 'Pedir cita', metaColor: '#6B7380', done: false },
      { title: 'Repasar apuntes', meta: '', done: true },
    ];
    const tasks = taskDefs.map((t, i) => ({
      ...t,
      hasMeta: Boolean(t.meta),
      aria: (t.done ? 'Desmarcar ' : 'Completar ') + t.title,
      boxBg: t.done ? '#1B8A55' : '#FFFFFF',
      boxRing: t.done ? 'none' : 'inset 0 0 0 1.5px #9AA2AE',
      fg: t.done ? '#9AA2AE' : '#101318',
      deco: t.done ? 'line-through' : 'none',
      border: i === taskDefs.length - 1 ? '0' : '1px solid #EEF1F4',
    }));
    return { days, agenda, tasks };
  }
}
</script>
</body>
</html>
