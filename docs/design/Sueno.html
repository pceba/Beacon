<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Beacon · Sueño</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,input{font-family:inherit}
button{border:0;cursor:pointer}
.lab{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#6B7380}
.row{min-height:60px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #EEF1F4}
.pill{min-height:40px;padding:0 14px;border-radius:12px;background:#F2F4F7;font-size:17px;font-weight:600;color:#101318}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;background:#FFFFFF;font-family:'Outfit',sans-serif;color:#101318;display:flex;flex-direction:column">
  <header style="padding:16px 12px 8px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center">
    <a href="Main.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 8px;font-size:16px;text-decoration:none;color:#4A5260">Cancelar</a>
    <h1 style="margin:0;text-align:center;font-size:17px;font-weight:600">Sueño</h1>
    <span></span>
  </header>

  <div style="flex:1;padding:12px 20px 0;display:flex;flex-direction:column;gap:26px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px">
      <div class="num" style="display:flex;align-items:baseline;gap:6px"><span style="font-size:60px;line-height:62px;font-weight:600;letter-spacing:-2px">7 h 45</span><span style="font-size:17px;font-weight:500;color:#6B7380">min</span></div>
      <span style="font-size:14px;color:#6B7380">Tu objetivo son 7 h · <span style="color:#14693F;font-weight:600">cumplido</span></span>
    </div>

    <div>
      <div class="row">
        <span style="width:32px;height:32px;border-radius:10px;background:#ECECFA;color:#4B4FC4;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
        <div style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px">Me acosté</span><span style="font-size:13px;color:#6B7380">Anoche</span></div>
        <button class="pill num" aria-label="Hora de acostarse, 23:15">23:15</button>
      </div>
      <div class="row">
        <span style="width:32px;height:32px;border-radius:10px;background:#FFF6E0;color:#8A5A00;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></span>
        <div style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px">Me levanté</span><span style="font-size:13px;color:#6B7380">Hoy</span></div>
        <button class="pill num" aria-label="Hora de levantarse, 07:00">07:00</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lab">¿Qué tal has dormido?</span>
      <div role="radiogroup" aria-label="Calidad del sueño" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#F2F4F7;border-radius:14px;padding:4px">
        <sc-for list="{{q}}" as="o" hint-placeholder-count="5">
          <button role="radio" aria-checked="{{o.on}}" style="min-height:44px;border-radius:10px;background:{{o.bg}};box-shadow:{{o.sh}};color:{{o.fg}};font-size:14px;font-weight:600">{{o.label}}</button>
        </sc-for>
      </div>
    </div>

    <button style="align-self:flex-start;min-height:44px;padding:0;background:transparent;display:flex;align-items:center;gap:8px;font-size:16px;color:#4A5260"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:#9AA2AE"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Añadir una nota</button>
  </div>

  <div style="padding:12px 20px 34px">
    <button style="width:100%;min-height:56px;border-radius:16px;background:#101318;color:#FFFFFF;font-size:17px;font-weight:600">Guardar sueño</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const q = ['Fatal', 'Mal', 'Normal', 'Bien', 'Genial'].map((label, i) => ({
      label, on: i === 3 ? 'true' : 'false',
      bg: i === 3 ? '#FFFFFF' : 'transparent',
      sh: i === 3 ? '0 1px 3px rgba(16,19,24,.12)' : 'none',
      fg: i === 3 ? '#101318' : '#6B7380',
    }));
    return { q };
  }
}
</script>
</body>
</html>
