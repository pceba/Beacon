<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Beacon · Datos</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2448D8}a:hover{color:#1A36A8}
.num{font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 2px rgba(16,19,24,.04),0 6px 16px rgba(16,19,24,.04)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit;border:0;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:1180px;box-sizing:border-box;position:relative;background:#F2F4F7;font-family:'Outfit',sans-serif;color:#101318;overflow:hidden">
  <div style="padding:58px 20px 120px;display:flex;flex-direction:column;gap:20px">
    <header style="display:flex;flex-direction:column;gap:14px">
      <h1 style="margin:0;font-size:32px;line-height:36px;font-weight:600;letter-spacing:-.6px">Datos</h1>
      <div role="tablist" aria-label="Periodo" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#E6E9EE;border-radius:14px;padding:4px">
        <button role="tab" aria-selected="true" style="min-height:38px;border-radius:10px;background:#FFFFFF;box-shadow:0 1px 3px rgba(16,19,24,.12);font-size:14px;font-weight:600;color:#101318">Semana</button>
        <button role="tab" aria-selected="false" style="min-height:38px;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:#6B7380">Mes</button>
        <button role="tab" aria-selected="false" style="min-height:38px;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:#6B7380">3 meses</button>
      </div>
    </header>

    <section aria-label="Resumen" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:600;color:#4A5260">{{k.label}}</span>
          <span class="num"><span style="font-size:26px;font-weight:600;letter-spacing:-.4px">{{k.value}}</span><span style="font-size:13px;color:#6B7380"> {{k.unit}}</span></span>
          <span class="num" style="align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{k.deltaBg}};color:{{k.deltaFg}}">{{k.delta}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-label="Sueño" class="card" style="padding:16px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <h2 style="margin:0;font-size:17px;font-weight:600">Sueño</h2>
        <span class="num" style="font-size:13px;color:#6B7380">objetivo 7 h</span>
      </div>
      <div style="position:relative;height:140px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end">
        <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:{{goalPx}};border-top:1.5px dashed #9AA2AE"></div>
        <sc-for list="{{sleep}}" as="s" hint-placeholder-count="7">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
            <span class="num" style="font-size:11px;font-weight:600;color:#4A5260">{{s.label}}</span>
            <div style="width:100%;max-width:26px;height:{{s.h}};border-radius:8px 8px 4px 4px;background:{{s.color}}"></div>
          </div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;text-align:center;font-size:12px;font-weight:600;color:#6B7380">
        <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>
    </section>

    <section aria-label="Hábitos" class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <h2 style="margin:0;font-size:17px;font-weight:600">Hábitos</h2>
        <span class="num" style="font-size:13px;color:#6B7380">78 % cumplidos</span>
      </div>
      <sc-for list="{{habits}}" as="h" hint-placeholder-count="4">
        <div style="display:grid;grid-template-columns:110px repeat(7,minmax(0,1fr));gap:6px;align-items:center">
          <span style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{h.name}}</span>
          <sc-for list="{{h.cells}}" as="c" hint-placeholder-count="7">
            <span style="height:22px;border-radius:6px;background:{{c.bg}}"></span>
          </sc-for>
        </div>
      </sc-for>
    </section>

    <section aria-label="Peso" class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <h2 style="margin:0;font-size:17px;font-weight:600">Peso</h2>
        <span class="num" style="font-size:13px;font-weight:600;color:#14693F">−0,6 kg en 30 días</span>
      </div>
      <div class="num"><span style="font-size:26px;font-weight:600">72,4</span><span style="font-size:13px;color:#6B7380"> kg</span></div>
      <svg viewBox="0 0 320 70" role="img" aria-label="Tendencia del peso, bajando ligeramente" style="width:100%;height:70px">
        <path d="M0 18 C40 14 60 24 90 26 S150 30 180 36 S240 40 270 46 S300 50 320 52" fill="none" stroke="#4A5260" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="320" cy="52" r="4.5" fill="#101318"/>
      </svg>
    </section>
  </div>

  <nav aria-label="Navegación" style="position:absolute;left:0;right:0;bottom:0;height:88px;padding:8px 12px 22px;box-sizing:border-box;background:rgba(255,255,255,.94);border-top:1px solid #E4E8EE;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#6B7380;font-size:11px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>Hoy</a>
    <a href="Plan.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#6B7380;font-size:11px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Plan</a>
    <a href="Registrar.dc.html" aria-label="Añadir" style="justify-self:center;width:56px;height:56px;border-radius:28px;background:#101318;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(16,19,24,.24);margin-top:-18px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px;stroke-width:2.4"><path d="M5 12h14M12 5v14"/></svg></a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#6B7380;font-size:11px;font-weight:500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Diario</a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#101318;font-size:11px;font-weight:600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>Datos</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const up = { deltaBg: '#E3F4EB', deltaFg: '#14693F' };
    const down = { deltaBg: '#FDECEA', deltaFg: '#B4291F' };
    const kpis = [
      { label: 'Sueño medio', value: '7,1', unit: 'h', delta: '+0,4 h', ...up },
      { label: 'Agua al día', value: '1,8', unit: 'L', delta: '+0,2 L', ...up },
      { label: 'Entrenos', value: '3', unit: 'sesiones', delta: 'igual', deltaBg: '#EEF1F4', deltaFg: '#4A5260' },
      { label: 'Calorías', value: '1.950', unit: 'kcal/día', delta: '−120', ...down },
    ];
    const hours = [6.5, 7.2, 5.8, 7.5, 8.1, 7.9, 6.9];
    const max = 9;
    const px = (h) => Math.round((h / max) * 110) + 'px';
    const sleep = hours.map((h) => ({
      label: String(h).replace('.', ','),
      h: px(h),
      color: h >= 7 ? '#4B4FC4' : '#BFC1EC',
    }));
    const goalPx = (Math.round((7 / max) * 110) + 18) + 'px';
    const habitDefs = [
      { name: 'Leer 20 min', color: '#2448D8', pattern: '1111111' },
      { name: 'Creatina', color: '#1B8A55', pattern: '0011111' },
      { name: 'Meditar', color: '#8B4FD1', pattern: '1010100' },
      { name: 'Estirar', color: '#D2551A', pattern: '0110110' },
    ];
    const habits = habitDefs.map((h) => ({
      name: h.name,
      cells: h.pattern.split('').map((c) => ({ bg: c === '1' ? h.color : '#EBEEF2' })),
    }));
    return { kpis, sleep, goalPx, habits };
  }
}
</script>
</body>
</html>
