<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Beacon · Plan · Calendario (v1.3)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{--ink:#101318;--text2:#4A5260;--text3:#6B7380;--text4:#9AA2AE;--border:#DDE2E9;--line:#EEF1F4;--bg:#F2F4F7;--fill:#F6F7F9;--track:#E6E9EE;--surface:#FFFFFF;--accent:#2448D8;--accentSoft:#E8EDFF;--danger:#B4291F;--food:#1B8A55;--workout:#D2551A;--workoutSoft:#FCEDE4}
  body{margin:0;background:#E4E8EE;font-family:'Outfit',sans-serif;color:var(--ink)}
  .num{font-variant-numeric:tabular-nums}
  .wall{display:flex;flex-wrap:wrap;gap:32px;padding:32px;align-items:flex-start}
  .label{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin:0 0 10px 4px}
  .phone{width:390px;height:844px;box-sizing:border-box;position:relative;background:var(--bg);overflow:hidden;border-radius:28px;box-shadow:0 10px 30px rgba(16,19,24,.12)}
  .pad{padding:54px 20px 0}
  .card{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(16,19,24,.04),0 6px 16px rgba(16,19,24,.04)}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.3px}
  .hbtn{min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font:600 14px 'Outfit';color:var(--ink);border:0}
  .plus{width:44px;height:44px;border-radius:22px;background:var(--ink);color:#fff;border:0;font-size:22px;line-height:44px}
  .seg{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--track);border-radius:14px;padding:4px}
  .seg span{min-height:36px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text2);border-radius:10px}
  .seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,19,24,.1)}
  .letters{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--text3);margin:16px 0 6px}
  .month{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,72px)}
  .mcell{border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
  .mnum{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
  .marks{display:flex;gap:3px;align-items:center;height:8px}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--accent)}
  .sq{width:6px;height:6px;border-radius:1.5px;background:var(--text2)}
  .sq.done{background:var(--text4)}
  .more{font-size:10px;font-weight:600;color:var(--text3)}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(255,255,255,.94);border-top:1px solid #E4E8EE;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;font-size:11px;color:var(--text3);text-align:center}
  .tabbar b{color:var(--ink)}
  .fab{justify-self:center;width:56px;height:56px;border-radius:28px;background:var(--ink);color:#fff;font-size:26px;line-height:56px;margin-top:-18px;box-shadow:0 6px 16px rgba(16,19,24,.24)}
  .weekhead{display:grid;grid-template-columns:40px repeat(7,1fr);margin-top:14px;text-align:center}
  .weekhead div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--text3)}
  .weekhead .n{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}
  .allday{display:grid;grid-template-columns:40px repeat(7,1fr);gap:2px;padding:6px 0;border-bottom:1px solid var(--line);font-size:10px}
  .chip{height:20px;border-radius:6px;padding:0 4px;display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap;font-weight:600}
  .chip.ev{background:var(--accentSoft);color:var(--accent)}
  .chip.tk{background:var(--fill);color:var(--text2)}
  .grid{position:relative;height:460px;overflow:hidden}
  .hour{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
  .hour span{position:absolute;left:0;top:-7px;width:34px;text-align:right;font-size:11px;color:var(--text4)}
  .ev{position:absolute;background:var(--accentSoft);border-radius:6px;border-left:3px solid var(--accent);padding:3px 4px;box-sizing:border-box;overflow:hidden}
  .ev b{display:block;font-size:12px;line-height:14px;font-weight:600;color:var(--ink)}
  .ev i{font-style:normal;font-size:11px;color:var(--text2)}
  .now{position:absolute;height:2px;background:var(--danger)}
  .now::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:var(--danger)}
  .slot{position:absolute;border:1.5px dashed var(--accent);border-radius:6px;background:rgba(36,72,216,.06);font-size:11px;font-weight:600;color:var(--accent);padding:3px 4px;box-sizing:border-box}
  .dayhead{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .arrow{width:44px;height:44px;border-radius:22px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:18px}
  h2{margin:0;font-size:17px;line-height:22px;font-weight:600}
  .row{min-height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:0 14px}
  .row:last-child{border-bottom:0}
  .box{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--text4);flex-shrink:0}
  .box.done{background:var(--food);box-shadow:none}
  .meta{font-size:13px;color:var(--text3)}
  .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 8px}
  .sd{min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .sd .l{font-size:11px;font-weight:600;color:var(--text3)}
  .sd .d{font-size:18px;font-weight:600}
  .sd.on{background:var(--ink)}.sd.on .l,.sd.on .d{color:#fff}
  .agenda{display:grid;grid-template-columns:64px 1fr;padding:10px 14px 10px 0;border-bottom:1px solid var(--line)}
  .agenda:last-child{border-bottom:0}
  .agenda .t{text-align:right;padding-right:10px;font-size:13px;font-weight:600;color:var(--text3)}
  .agenda .c{display:flex;gap:10px}
  .bar3{width:3px;border-radius:2px;background:var(--accent)}
  .note{max-width:390px;font-size:13px;line-height:18px;color:var(--text2);margin:10px 4px 0}
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<script>
const LET = ['L','M','X','J','V','S','D'];
const tabbar = `<nav class="tabbar"><span>Hoy</span><b>Plan</b><span class="fab">+</span><span>Diario</span><span>Datos</span></nav>`;
const head = (title, view) => `
  <header><h1>${title}</h1><div style="display:flex;gap:8px"><button class="hbtn">Hoy</button><button class="plus" aria-label="Añadir">+</button></div></header>
  <div class="seg">${['Mes','Semana','Día','Lista'].map(v => `<span class="${v===view?'on':''}">${v}</span>`).join('')}</div>`;

function month() {
  // Octubre 2026 empieza en jueves: 3 huecos de septiembre.
  const marks = {2:['e'],5:['e','t'],7:['t'],9:['e','e','t','t','e'],12:['td'],14:['e','t'],15:['e','e'],16:['e','t','td'],20:['t'],22:['e'],27:['e','t'],30:['e']};
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const day = i - 3 + 1;
    const inMonth = day >= 1 && day <= 31;
    const shown = inMonth ? day : day < 1 ? 30 + day : day - 31;
    const today = day === 21, sel = day === 16;
    const m = (inMonth && marks[day]) || [];
    const dots = m.slice(0,3).map(k => k==='e' ? '<span class="dot"></span>' : `<span class="sq ${k==='td'?'done':''}"></span>`).join('');
    const extra = m.length > 3 ? `<span class="more">+${m.length-3}</span>` : '';
    const numStyle = today ? 'background:var(--ink);color:#fff' : sel ? 'box-shadow:inset 0 0 0 1.5px var(--ink)' : inMonth ? '' : 'color:var(--text4)';
    cells += `<div class="mcell"><span class="mnum num" style="${numStyle}">${shown}</span><span class="marks">${dots}${extra}</span></div>`;
  }
  return `<div class="pad">${head('octubre 2026','Mes')}
    <div class="letters">${LET.map(l=>`<span>${l}</span>`).join('')}</div>
    <div class="card" style="padding:0 4px 4px;overflow:hidden"><div class="month">${cells}</div></div>
  </div>${tabbar}`;
}

function week() {
  const H = 40, top0 = 8; // 8:00 arriba; 40 px por hora en el mock (48 en la app)
  const colW = (350 - 40) / 7;
  const x = (d) => 40 + d * colW;
  const y = (h) => (h - top0) * H;
  const events = [
    {d:0,s:9,e:10.5,t:'Clase',c:0,n:1},
    {d:1,s:18.5,e:19.5,t:'Pierna',c:0,n:1},
    {d:3,s:10,e:11.5,t:'Clase',c:0,n:2},{d:3,s:10.75,e:12,t:'Tutoría',c:1,n:2},
    {d:3,s:18,e:19,t:'Dentista',c:0,n:1},
    {d:4,s:13,e:14,t:'Comida',c:0,n:3},{d:4,s:13.25,e:14.5,t:'Llamada',c:1,n:3},{d:4,s:13.5,e:15,t:'Revisión',c:2,n:3},
    {d:5,s:11,e:13,t:'Mercado',c:0,n:1},
  ];
  const fmt = (h) => `${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round((h%1)*60)).padStart(2,'0')}`;
  let grid = '';
  for (let h = top0; h <= top0 + 11; h++) grid += `<div class="hour" style="top:${y(h)}px"><span class="num">${String(h).padStart(2,'0')}</span></div>`;
  events.forEach(ev => {
    const w = (colW - 2) / ev.n;
    grid += `<div class="ev" style="left:${x(ev.d) + 1 + ev.c * w}px;width:${w - 1}px;top:${y(ev.s)}px;height:${Math.max((ev.e-ev.s)*H,22)}px"><b>${ev.t}</b><i class="num">${fmt(ev.s)}</i></div>`;
  });
  grid += `<div class="now" style="left:${x(2)}px;width:${colW}px;top:${y(16.6)}px"></div>`;
  grid += `<div class="slot" style="left:${x(6)+1}px;width:${colW-2}px;top:${y(10)}px;height:${H}px">10:00</div>`;
  const nums = [19,20,21,22,23,24,25];
  return `<div class="pad">${head('octubre 2026','Semana')}
    <div class="weekhead"><span></span>${nums.map((n,i)=>`<div>${LET[i]}<span class="n num" style="${i===2?'background:var(--ink);color:#fff':''}">${n}</span></div>`).join('')}</div>
    <div class="allday"><span style="font-size:10px;color:var(--text4);align-self:center">todo</span>
      <span class="chip ev">Viaje</span><span></span><span class="chip tk">▢ TFG</span><span class="chip tk">▢ Pagar</span><span class="chip tk">+2</span><span></span><span class="chip ev">Boda</span></div>
    <div class="grid">${grid}</div>
  </div>${tabbar}`;
}

function day() {
  const H = 48, top0 = 9;
  const y = (h) => (h - top0) * H;
  let grid = '';
  for (let h = top0; h <= 13; h++) grid += `<div class="hour" style="top:${y(h)}px"><span class="num">${String(h).padStart(2,'0')}</span></div>`;
  grid += `<div class="ev" style="left:41px;width:150px;top:${y(10)}px;height:${1.5*H}px"><b>Clase</b><i class="num">10:00 – 11:30 · Aula 3.2</i></div>`;
  grid += `<div class="ev" style="left:193px;width:150px;top:${y(10.75)}px;height:${1.25*H}px"><b>Tutoría</b><i class="num">10:45 – 12:00</i></div>`;
  return `<div class="pad">${head('octubre 2026','Día')}
    <div class="dayhead"><span class="arrow">‹</span><h2>Miércoles 21</h2><span class="arrow">›</span></div>
    <div class="card" style="margin-top:10px;padding:8px 14px 4px 0">
      <div class="allday" style="grid-template-columns:40px 1fr;border:0"><span style="font-size:10px;color:var(--text4);align-self:center;text-align:right;padding-right:4px">todo</span><span class="chip ev" style="width:max-content">Cumpleaños de Ana</span></div>
      <div class="grid" style="height:${4*H+8}px">${grid}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px"><h2>Tareas</h2><span class="meta num">1 de 3 hechas</span></div>
    <div class="card">
      <div class="row"><span style="color:var(--text3)">+</span><span style="color:var(--text4)">Añadir tarea</span></div>
      <div class="row"><span class="box"></span><div><div>Entregar TFG</div><div class="meta" style="color:var(--danger)">Vence hoy · Alta</div></div></div>
      <div class="row"><span class="box"></span><div>Comprar creatina</div></div>
      <div class="row"><span class="box done"></span><div style="color:var(--text4);text-decoration:line-through">Repasar apuntes</div></div>
    </div>
  </div>${tabbar}`;
}

function list() {
  const days = [19,20,21,22,23,24,25];
  return `<div class="pad">${head('octubre 2026','Lista')}
    <div class="card strip" style="margin-top:14px">${days.map((n,i)=>`<div class="sd ${i===2?'on':''}"><span class="l">${LET[i]}</span><span class="d num">${n}</span><span class="marks">${[0,2,3].includes(i)?'<span class="dot" style="width:4px;height:4px;'+(i===2?'background:#fff':'')+'"></span>':''}</span></div>`).join('')}</div>
    <h2 style="margin:20px 4px 10px">Miércoles 21</h2>
    <div class="card" style="padding:4px 0">
      <div class="agenda"><span class="t num">10:00</span><div class="c"><span class="bar3"></span><div><div style="font-weight:600">Clase</div><div class="meta">Aula 3.2</div></div></div></div>
      <div class="agenda"><span class="t num">10:45</span><div class="c"><span class="bar3"></span><div><div style="font-weight:600">Tutoría</div><div class="meta">Despacho 12</div></div></div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px"><h2>Tareas</h2><span class="meta num">1 de 3 hechas</span></div>
    <div class="card">
      <div class="row"><span style="color:var(--text3)">+</span><span style="color:var(--text4)">Añadir tarea</span></div>
      <div class="row"><span class="box"></span><div>Entregar TFG</div></div>
      <div class="row"><span class="box done"></span><div style="color:var(--text4);text-decoration:line-through">Repasar apuntes</div></div>
    </div>
  </div>${tabbar}`;
}

const frames = [
  ['Mes', month(), 'Seis filas siempre. Punto = evento, cuadrado = tarea (gris si está hecha), +N si hay más de 3. Deslizar cambia de mes; tocar un día abre Día.'],
  ['Semana', week(), 'Franja de todo el día arriba (+N si hay más de 2). Solapes en columnas. Línea roja de ahora solo en hoy. Tocar un hueco crea un evento a esa hora (redondeada a 15 min).'],
  ['Día', day(), 'Una columna horaria con las horas que tienen eventos ±1 h; debajo, las tareas de siempre.'],
  ['Lista', list(), 'El Plan v1.2 tal cual: tira semanal, agenda y tareas del día.'],
];
document.getElementById('wall').innerHTML = frames.map(([name, html, note]) => `<section><p class="label">${name}</p><div class="phone">${html}</div><p class="note">${note}</p></section>`).join('');
</script>
</body>
</html>
